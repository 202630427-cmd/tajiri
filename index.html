<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밤이면 밤마다 — 카페인 없는 음료 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1A1C3A;
  --night-deep:#111327;
  --panel:#23264A;
  --panel-2:#2C2F58;
  --tea:#E9B44C;
  --herb:#8FC0A9;
  --blush:#D98C8C;
  --text:#EDEAF2;
  --text-dim:#A7A4BE;
  --line:#3A3D66;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
:root[data-theme="dark"]{ color-scheme:dark; }

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--night);
  color:var(--text);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.wrap{
  max-width:640px;margin:0 auto;padding:20px 22px 24px;
  width:100%;
  flex:1;
  display:flex;flex-direction:column;
}

.topbar{
  display:flex;flex-direction:column;align-items:center;
  gap:2px;margin-bottom:20px;text-align:center;
  position:relative;
}
.mark{font-family:"Gowun Batang",serif;font-size:26px;letter-spacing:.02em;font-weight:700;cursor:default;user-select:none;}
.mark span{color:var(--tea);}
.clock{font-size:12px;color:var(--text-dim);}

/* ---- 이스터에그: 낙하 게임 ---- */
.egg-overlay{
  position:fixed;inset:0;z-index:80;
  background:var(--night-deep);
  opacity:0;visibility:hidden;transform:scale(.97);
  transition:opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
  pointer-events:none;
  overflow:hidden;
  touch-action:none;
}
.egg-overlay.open{
  opacity:1;visibility:visible;transform:scale(1);pointer-events:auto;
  transition:opacity .22s ease, transform .22s ease;
}
.egg-hud{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:14px;color:var(--text);z-index:3;
}
.egg-hud .lives{letter-spacing:2px;}
.egg-close{
  width:34px;height:34px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.egg-item{
  position:absolute;font-size:22px;line-height:1;user-select:none;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transform:translateX(-50%);
}
.egg-item.good{background:rgba(143,192,169,.22);border:2px solid var(--herb);box-shadow:0 0 10px rgba(143,192,169,.35);}
.egg-item.bad{background:rgba(217,140,140,.22);border:2px solid var(--blush);box-shadow:0 0 10px rgba(217,140,140,.35);}
.egg-basket{
  position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));
  font-size:38px;line-height:1;transform:translateX(-50%);user-select:none;
}
.egg-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:0 30px;
}
.egg-msg h3{font-family:"Gowun Batang",serif;font-size:22px;margin:0;}
.egg-msg p{margin:0;color:var(--text-dim);font-size:14px;}
.egg-btn{
  font-family:inherit;font-size:14px;color:var(--night);background:var(--tea);
  border:none;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:600;
}

.mono-toggle{
  position:absolute;top:0;right:0;
  width:34px;height:34px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.16s ease;
}
.mono-toggle:hover{background:var(--panel-2);}
.mono-toggle:focus-visible{outline:2px solid var(--tea);outline-offset:2px;}
.mono-toggle[aria-pressed="true"]{background:var(--text);color:var(--night);border-color:var(--text);}

body.light{
  --night:#F7F7FB;
  --night-deep:#EFEFF6;
  --panel:#FFFFFF;
  --panel-2:#F1F1F8;
  --tea:#C97F1C;
  --herb:#3F9668;
  --blush:#C2564F;
  --text:#16171F;
  --text-dim:#6B6D80;
  --line:#E5E5EF;
}
body.light .card,
body.light .price-chip,
body.light .mood,
body.light .nav-arrow,
body.light .mono-toggle{
  box-shadow:0 2px 10px rgba(22,23,31,.06);
}
body.light .mood[aria-pressed="true"]{
  box-shadow:0 4px 14px rgba(201,127,28,.28);
}
body.light .next-btn{
  box-shadow:0 4px 14px rgba(63,150,104,.28);
}

.ask{display:none;}

/* ---- 상태 선택: 큰 타일 ---- */
.moods{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin:0 0 22px;
}
.mood{
  font-family:inherit;color:var(--text-dim);
  background:var(--panel);border:1.5px solid var(--line);border-radius:16px;
  padding:18px 6px 14px;cursor:pointer;transition:.16s ease;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.mood .ico{font-size:34px;line-height:1;}
.mood .lab{font-size:12.5px;font-weight:400;text-align:center;line-height:1.3;}
.mood:hover{border-color:var(--herb);}
.mood:focus-visible{outline:2px solid var(--tea);outline-offset:2px;}
.mood[aria-pressed="true"]{
  background:var(--tea);border-color:var(--tea);color:#231B06;
}
.mood[aria-pressed="true"] .lab{font-weight:600;}

@media (max-width:420px){
  .moods{grid-template-columns:repeat(3,1fr);}
}

.random-btn{
  font-family:inherit;color:var(--night);
  background:linear-gradient(135deg,var(--tea),#F2CE7A);
  border:none;border-radius:16px;
  padding:16px 6px 14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  width:100%;
}
.reel-window{
  width:58px;height:58px;border-radius:10px;
  background:#1B1204;
  overflow:hidden;position:relative;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.5);
}
.reel-window::before,
.reel-window::after{
  content:"";position:absolute;left:0;right:0;height:16px;
  background:linear-gradient(#1B1204, rgba(27,18,4,0));
  z-index:2;pointer-events:none;
}
.reel-window::before{top:0;}
.reel-window::after{bottom:0;transform:rotate(180deg);}
.reel-track{position:absolute;left:0;top:0;width:100%;}
.reel-item{
  height:58px;display:flex;align-items:center;justify-content:center;
  font-size:32px;line-height:1;
}
.random-btn .lab{font-size:12.5px;font-weight:600;color:#231B06;text-align:center;line-height:1.3;}
.random-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
.random-btn:disabled{cursor:default;}

/* ---- 결과 스테이지 : 좌우 화살표 + 카드 ---- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;}
.decor{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:10px 0 20px;
}
.decor svg{width:100%;max-width:320px;height:auto;}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 4.2s ease-in-out infinite;transform-origin:center;}
  .f1{animation-duration:4.4s;animation-delay:0s;}
  .f2{animation-duration:5.1s;animation-delay:.4s;}
  .f3{animation-duration:4.7s;animation-delay:.9s;}
  .f4{animation-duration:5.4s;animation-delay:.2s;}
  .f5{animation-duration:4.9s;animation-delay:1.1s;}
  .f6{animation-duration:5.6s;animation-delay:.6s;}
  @keyframes bob{
    0%{transform:translateY(0) rotate(0deg) scale(1);}
    25%{transform:translateY(-6px) rotate(-4deg) scale(1.03);}
    50%{transform:translateY(-9px) rotate(0deg) scale(1.05);}
    75%{transform:translateY(-4px) rotate(4deg) scale(1.02);}
    100%{transform:translateY(0) rotate(0deg) scale(1);}
  }
  .twinkle{animation:twinkle 2.4s ease-in-out infinite;transform-origin:center;}
  .t2{animation-delay:.5s;}
  .t3{animation-delay:1s;}
  @keyframes twinkle{
    0%,100%{opacity:.2;transform:scale(.6);}
    50%{opacity:1;transform:scale(1.25);}
  }
}
.deck{
  position:fixed;inset:0;z-index:50;
  background:var(--night);
  display:flex;align-items:stretch;gap:8px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
  opacity:0;visibility:hidden;transform:scale(.96);
  transition:opacity .26s ease, transform .26s ease, visibility 0s linear .26s;
  pointer-events:none;
}
.deck.open{
  opacity:1;visibility:visible;transform:scale(1);
  transition:opacity .26s ease, transform .26s ease;
  pointer-events:auto;
}
.close-btn{
  position:absolute;top:16px;left:16px;z-index:51;
  width:38px;height:38px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.close-btn:hover{background:var(--panel-2);}
.close-btn:focus-visible{outline:2px solid var(--tea);outline-offset:2px;}
.hint{
  text-align:center;color:var(--text-dim);font-size:13.5px;
  border:1px dashed var(--line);border-radius:16px;padding:40px 20px;
}
.deck{display:flex;align-items:center;gap:8px;}
.nav-arrow{
  flex:0 0 auto;align-self:center;
  width:38px;height:38px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.16s ease;
}
.nav-arrow:hover{background:var(--panel-2);border-color:var(--herb);}
.nav-arrow:focus-visible{outline:2px solid var(--tea);outline-offset:2px;}
.nav-arrow:disabled{opacity:.3;cursor:default;}

.card{
  width:100%;height:100%;
  background:var(--panel);
  padding:32px 26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  gap:16px;
}
.card .emoji{font-size:80px;line-height:1;}
.card h2{font-family:"Gowun Batang",serif;font-size:clamp(28px,7vw,40px);margin:0;font-weight:700;}
.card .desc{
  font-family:"Gowun Batang",serif;
  font-size:clamp(17px,4.4vw,22px);color:var(--text-dim);
  font-style:italic;letter-spacing:.01em;
  margin:0;max-width:26em;line-height:1.8;
}

/* ---- 위치 점 표시 ---- */
.dots{
  position:absolute;left:0;right:0;bottom:22px;
  display:flex;justify-content:center;gap:6px;
}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer;
}
.dot[aria-current="true"]{background:var(--tea);width:18px;border-radius:4px;}
.dot:focus-visible{outline:2px solid var(--tea);outline-offset:2px;}

footer{padding-top:16px;font-size:12px;color:var(--text-dim);text-align:center;}

#cardBox{position:relative;overflow:hidden;height:100%;}
.page{width:100%;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease;}
.page.exit-left{transform:translateX(-100%);opacity:0;}
.page.exit-right{transform:translateX(100%);opacity:0;}
.page.enter-from-left{transform:translateX(-100%);opacity:0;}
.page.enter-from-right{transform:translateX(100%);opacity:0;}
.page.enter-first{opacity:0;transform:scale(.92);}
.page.settled{transform:translateX(0) scale(1);opacity:1;}
.page.exit-left,
.page.exit-right{position:absolute;top:0;left:0;z-index:2;}
@media (prefers-reduced-motion:reduce){
  .page{transition:none;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">

    <div class="mark" id="logoMark">밤이면 밤마다<span>.</span></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="egg-overlay" id="eggOverlay">

      <span id="eggScore">0점</span>

    <div id="eggField" style="position:absolute;inset:0;"></div>
    <div class="egg-msg" id="eggStart">
      <h3>카페인 피하기</h3>
      <p>초록 테두리는 디카페인, 빨강 테두리는 카페인이에요.<br>화면을 좌우로 밀어서 컵을 움직이고, 초록만 받으세요.</p>
      <button class="egg-btn" id="eggStartBtn">시작</button>
    </div>
  </div>

  <div class="moods" id="moods" role="group" aria-label="상태 선택">
    <button class="mood" data-mood="sleep" aria-pressed="false"><span class="ico">😴</span><span class="lab">잠이<br>안 와요</span></button>

  <button class="random-btn" id="randomBtn">

        <g class="twinkle t2"><circle cx="300" cy="150" r="1.8" fill="var(--tea)"/></g>

        <path d="M244 40c8-10 22-10 28 2 10-4 22 4 20 16-2 10-14 14-22 10-2 8-14 12-22 6-8 10-22 6-24-6-10 0-16-12-8-20 2-6 20-14 28-8z"

        <g class="float f1">
          <g transform="translate(60 90)">
            <circle cx="0" cy="-14" r="8" fill="var(--blush)" opacity=".9"/>
            <circle cx="12" cy="-6" r="8" fill="var(--blush)" opacity=".9"/>

          <g transform="translate(246 172) scale(.8)">

            <circle cx="0" cy="-13" r="7" fill="var(--herb)" opacity=".85"/>

    </div>
    <div class="deck" id="deck">
      <button class="close-btn" id="closeBtn" aria-label="닫기">✕</button>
      <button class="nav-arrow" id="prevBtn" aria-label="이전 추천">‹</button>

  <footer>디카페인도 카페인이 소량 남아있을 수 있어요. 잠들기 6시간 전부터는 완전 0인 쪽을 골라 보세요.</footer>

<script>
const DRINKS = [

  {name:"따뜻한 우유 + 꿀", emoji:"🥛", caf:"zero", moods:["sleep"],

let mood = null;
let idx = 0;
let randomPick = null;

function matches(){
  if(mood === "random") return randomPick ? [randomPick] : [];
  return DRINKS.filter(d => d.moods.includes(mood));
}

function buildCardHTML(d, idx, total){
  return `
    <div class="card">
      <div class="emoji" aria-hidden="true">${d.emoji}</div>
      <h2>${d.name}</h2>
      <p class="desc">${d.desc}</p>
    </div>
  `;
}

function makePageEl(html, startClass){
  const wrap = document.createElement("div");
  wrap.className = "page" + (startClass ? " " + startClass : "");
  wrap.innerHTML = html;
  return wrap;
}

function render(dir){
  const deck = document.getElementById("deck");
  const dots = document.getElementById("dots");

  if(!mood){
    deck.classList.remove("open");
    dots.innerHTML = "";
    return;
  }
  deck.classList.add("open");

  const list = matches();
  if(idx >= list.length) idx = 0;
  if(idx < 0) idx = list.length - 1;
  const d = list[idx];
  const html = buildCardHTML(d, idx, list.length);

  const cardBox = document.getElementById("cardBox");
  const oldPage = cardBox.querySelector(".page");

  if(oldPage && dir){
    const newPage = makePageEl(html, dir === "right" ? "enter-from-right" : "enter-from-left");
    cardBox.appendChild(newPage);
    newPage.getBoundingClientRect();
    requestAnimationFrame(() => {
      oldPage.classList.add(dir === "right" ? "exit-left" : "exit-right");
      newPage.classList.remove("enter-from-left","enter-from-right");
      newPage.classList.add("settled");
    });
    window.setTimeout(() => { if(oldPage.parentNode) oldPage.remove(); }, 320);
  } else {
    cardBox.innerHTML = "";
    const firstPage = makePageEl(html, "enter-first");
    cardBox.appendChild(firstPage);
    firstPage.getBoundingClientRect();
    requestAnimationFrame(() => {
      firstPage.classList.remove("enter-first");
      firstPage.classList.add("settled");
    });
  }

  document.getElementById("dots").innerHTML = list.map((_,i) =>
    `<button class="dot" data-i="${i}" aria-current="${i===idx}" aria-label="${i+1}번째 추천"></button>`
  ).join("");

  document.getElementById("prevBtn").disabled = list.length <= 1;
  document.getElementById("nextBtn").disabled = list.length <= 1;
}

document.getElementById("randomBtn").addEventListener("click", () => {
  const btn = document.getElementById("randomBtn");
  const track = document.getElementById("reelTrack");
  if(btn.disabled) return;
  btn.disabled = true;

  document.querySelectorAll(".mood").forEach(b => b.setAttribute("aria-pressed","false"));

  const ITEM_H = 58;
  const LAPS = 4;
  const pick = DRINKS[Math.floor(Math.random() * DRINKS.length)];

  const reelItems = [];
  for(let i = 0; i < DRINKS.length * LAPS; i++){
    reelItems.push(DRINKS[Math.floor(Math.random() * DRINKS.length)].emoji);
  }
  reelItems.push(pick.emoji);

  track.style.transition = "none";
  track.style.transform = "translateY(0)";
  track.innerHTML = reelItems.map(e => `<div class="reel-item">${e}</div>`).join("");

  track.getBoundingClientRect();
  requestAnimationFrame(() => {
    const finalY = -(reelItems.length - 1) * ITEM_H;
    track.style.transition = "transform 1.7s cubic-bezier(.12,.72,.2,1)";
    track.style.transform = `translateY(${finalY}px)`;
  });

  window.setTimeout(() => {
    btn.disabled = false;
    randomPick = pick;
    mood = "random";
    idx = 0;
    render("right");
  }, 1750);
});

document.getElementById("moods").addEventListener("click", e => {
  const btn = e.target.closest(".mood");
  if(!btn) return;
  const chosen = btn.dataset.mood;
  mood = (mood === chosen) ? null : chosen;
  idx = 0;
  document.querySelectorAll(".mood").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.mood === mood)));
  render("right");
});

document.getElementById("cardBox").addEventListener("click", e => {
  const btn = e.target.closest(".recipe-btn");
  if(!btn) return;
  const box = btn.nextElementSibling;
  const open = box.hidden;
  box.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  btn.querySelector("span").textContent = open ? "접기" : "만드는 법 보기";
});

document.getElementById("closeBtn").addEventListener("click", () => {
  mood = null;
  document.querySelectorAll(".mood").forEach(b => b.setAttribute("aria-pressed","false"));
  render();
});

document.getElementById("prevBtn").addEventListener("click", () => { idx--; render("left"); });
document.getElementById("nextBtn").addEventListener("click", () => { idx++; render("right"); });

document.getElementById("dots").addEventListener("click", e => {
  const dot = e.target.closest(".dot");
  if(!dot) return;
  const newIdx = parseInt(dot.dataset.i, 10);
  const dir = newIdx > idx ? "right" : "left";
  idx = newIdx;
  render(dir);
});

const GOOD_EMOJI = ["🌼","🥛","🍂","🌿","🫚","🧉","🍵","🫘"];
const BAD_EMOJI  = ["☕","⚡","🥤"];

let eggRunning = false, eggScore = 0, eggLives = 3, eggBasketX = 50;
let eggItems = [], eggSpawnTimer = null, eggRAF = null, eggLastSpawn = 0;

function openEgg(){
  document.getElementById("eggOverlay").classList.add("open");
  document.getElementById("eggStart").style.display = "flex";
  document.getElementById("eggField").innerHTML = "";
  eggScore = 0; eggLives = 3;
  updateEggHud();
}
function closeEgg(){
  eggRunning = false;
  cancelAnimationFrame(eggRAF);
  document.getElementById("eggOverlay").classList.remove("open");
}
function updateEggHud(){
  document.getElementById("eggScore").textContent = eggScore + "점";
  document.getElementById("eggLives").textContent = "❤️".repeat(Math.max(eggLives,0)) + "🖤".repeat(3-Math.max(eggLives,0));
}

function startEgg(){
  document.getElementById("eggStart").style.display = "none";
  const field = document.getElementById("eggField");
  field.innerHTML = "";
  eggItems = [];
  eggScore = 0; eggLives = 3; eggBasketX = 50;
  updateEggHud();

  const basket = document.createElement("div");
  basket.className = "egg-basket";
  basket.id = "eggBasket";
  basket.textContent = "🧋";
  field.appendChild(basket);

  eggRunning = true;
  eggLastSpawn = 0;
  eggRAF = requestAnimationFrame(eggLoop);
}

function eggLoop(ts){
  if(!eggRunning) return;
  const field = document.getElementById("eggField");
  const fw = field.clientWidth, fh = field.clientHeight;

  if(!eggLastSpawn || ts - eggLastSpawn > 620){
    eggLastSpawn = ts;
    const isGood = Math.random() > 0.35;
    const emoji = isGood
      ? GOOD_EMOJI[Math.floor(Math.random()*GOOD_EMOJI.length)]
      : BAD_EMOJI[Math.floor(Math.random()*BAD_EMOJI.length)];
    const el = document.createElement("div");
    el.className = "egg-item " + (isGood ? "good" : "bad");
    el.textContent = emoji;
    const x = 10 + Math.random() * 80;
    el.style.left = x + "%";
    el.style.top = "-30px";
    field.appendChild(el);
    eggItems.push({el, x, y:-30, good:isGood, speed:1.6 + Math.random()*1.4});
  }

  const basket = document.getElementById("eggBasket");
  basket.style.left = eggBasketX + "%";
  const basketY = fh - 70;

  for(let i = eggItems.length - 1; i >= 0; i--){
    const it = eggItems[i];
    it.y += it.speed;
    it.el.style.top = it.y + "px";

    const dx = Math.abs((it.x/100*fw) - (eggBasketX/100*fw));
    if(it.y > basketY - 20 && it.y < basketY + 20 && dx < 34){
      if(it.good){ eggScore++; }
      else { eggLives--; }
      updateEggHud();
      it.el.remove();
      eggItems.splice(i,1);
      if(eggLives <= 0){ endEgg(); return; }
      continue;
    }
    if(it.y > fh + 30){
      it.el.remove();
      eggItems.splice(i,1);
    }
  }

  eggRAF = requestAnimationFrame(eggLoop);
}

function endEgg(){
  eggRunning = false;
  cancelAnimationFrame(eggRAF);
  const field = document.getElementById("eggField");
  eggItems.forEach(it => it.el.remove());
  eggItems = [];
  const msg = document.getElementById("eggStart");
  msg.innerHTML = `<h3>카페인에 당첨...</h3><p>이번 점수: ${eggScore}점</p><button class="egg-btn" id="eggStartBtn">다시하기</button>`;
  msg.style.display = "flex";
  document.getElementById("eggStartBtn").addEventListener("click", startEgg);
}

document.getElementById("eggStartBtn").addEventListener("click", startEgg);
document.getElementById("eggClose").addEventListener("click", closeEgg);

document.getElementById("eggOverlay").addEventListener("pointermove", e => {
  if(!eggRunning) return;
  const rect = document.getElementById("eggField").getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  eggBasketX = Math.min(94, Math.max(6, pct));
});

document.getElementById("monoToggle").addEventListener("click", () => {
  const btn = document.getElementById("monoToggle");
  const isLight = document.body.classList.toggle("light");

  btn.setAttribute("aria-label", isLight ? "다크 모드 전환" : "라이트 모드 전환");
});
